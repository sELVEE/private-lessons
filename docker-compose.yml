# Local development:
#   docker compose up -d                 -> Postgres, Redis, Mailpit (run API/web with pnpm)
#   docker compose --profile app up -d   -> also the built API and web on http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pl
      POSTGRES_PASSWORD: pl
      POSTGRES_DB: private_lessons
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pl']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025' # web UI with every e-mail the app sends
      - '127.0.0.1:1025:1025'

  api:
    profiles: [app]
    image: private-lessons-api
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: apps/api/.env
    environment:
      # Production image, but plain http on localhost; real deployments use NODE_ENV=production + TLS.
      NODE_ENV: development
      APP_URL: http://localhost:8080
      DATABASE_URL: postgres://pl:pl@postgres:5432/private_lessons
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      MAIL_TRANSPORT: smtp
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    profiles: [app]
    image: private-lessons-web
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
