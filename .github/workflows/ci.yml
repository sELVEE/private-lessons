name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pl
          POSTGRES_PASSWORD: pl
          POSTGRES_DB: private_lessons_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pl" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://pl:pl@localhost:5432/private_lessons_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pl/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Format check
        run: pnpm exec prettier --check "**/*.{ts,html,scss,json,yml,md}"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies for known vulnerabilities
        run: pnpm audit --prod --audit-level high
